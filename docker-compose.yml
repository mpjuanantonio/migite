# docker-compose.yml — base compartida: un único servicio `app`.
# ADR-005/006: sin Postgres, sin LiteLLM y sin SearXNG (servicios descartados).
# Combínalo siempre con un override:
#   dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#   prod: VERSION=vX.Y.Z docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# `docker compose up` a secas construye la imagen prod estrictamente local.
services:
  app:
    build:
      context: .
      target: prod
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - vault:/app/vault
      - indice:/app/data

volumes:
  vault:
  indice:
