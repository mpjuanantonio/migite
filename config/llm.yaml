providers:
  - id: google
    baseUrl: https://generativelanguage.googleapis.com/v1beta/openai
    apiKeyEnv: GEMINI_API_KEY
  - id: opencode
    baseUrl: https://opencode.ai/inference/go/openai/v1
    apiKeyEnv: OPENACODE_API_KEY
roles:
  chat: { provider: google, model: gemini-3.8-flash }
  retrieve: { provider: google, model: gemini-3.8-flash }
  summarize: { provider: google, model: gemini-3.8-flash }
  embeddings: { provider: google, model: gemini-embedding-001 }
