name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag a desplegar (ej. v1.4.2)"
        required: true

jobs:
  deploy:
    runs-on: [self-hosted, linux]   # runner en tu servidor de produccion
    environment: production        # gate humano: required reviewers
    steps:
      - name: Desplegar
        run: |
          cd /srv/migite
          echo "VERSION=${{ inputs.version }}" > .env.deploy
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.deploy pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.deploy up -d --no-build --remove-orphans
          docker image prune -f

      - name: Health check (smoke test)
        run: |
          sleep 10
          curl -fsS http://localhost:3000/health || exit 1

      - name: Rollback hint
        if: failure()
        run: |
          echo "DESPLEGUE FALLIDO. Rollback: relanzar este workflow con el tag anterior"
          echo "(p. ej. version=v1.4.1). El comando es idempotente."