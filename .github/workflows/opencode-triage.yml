name: opencode-triage

on:
  issues:
    types: [opened]

jobs:
  triage:
    if: github.event.issue.user.login == 'mpjuanantonio' 
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          OPENCODE_PERMISSION: '{"edit": "deny", "bash": "deny"}'
        with:
          share: false
          model: opencode-go/mimo-v2.6-flash
          prompt: |
            Revisa este issue nuevo y responde SOLO con una clasificación:
            - Tipo: bug | feature | pregunta | deuda técnica
            - Severidad: baja | media | alta
            - Accionable: sí / no (si falta contexto, indícalo)
            No implementes nada. No propongas PRs. Solo clasifica.
