name: opencode-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  review:
    # Unico caso que falla: eventos disparados por bots (assertPermissions de
    # opencode rechaza App actors, issue #48338). El review del PR creado por
    # /oc se lanza con un comentario humano: "/oc review" en el PR.
    if: |
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.login == 'mpjuanantonio' &&
       startsWith(github.event.comment.body, '/oc review')) ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !endsWith(github.actor, '[bot]'))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{"edit": "deny", "bash": "deny"}'
        with:
          model: opencode-go/glm-5.3-flash
          use_github_token: true
          share: false
          prompt: |
            Eres el revisor de codigo de este repositorio. Solo analizas:
            no editas nada. Revisa este pull request contra AGENTS.md y
            devuelve tus hallazgos como comentario del PR:

            1. **Bloqueantes** - bugs, fugas de secretos, perdida de datos
            2. **Importantes** - diseno, rendimiento, edge cases
            3. **Sugerencias** - estilo, naming, simplificacion

            Cada hallazgo: `archivo:linea` + problema + propuesta concreta.
            Si no hay hallazgos, responde exactamente "APROBADO".